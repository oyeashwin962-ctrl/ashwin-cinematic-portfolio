<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06080b" />
      <stop offset="45%" stopColor="#0a1017" />
      <stop offset="100%" stopColor="#040507" />
    </linearGradient>

    <!-- Monitor ambient screen glow -->
    <radialGradient id="screen-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#d6a84f" stopOpacity="0.22" />
      <stop offset="35%" stopColor="#1e3a5f" stopOpacity="0.18" />
      <stop offset="100%" stopColor="#05080c" stopOpacity="0" />
    </radialGradient>

    <linearGradient id="timeline-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#1a2530" />
      <stop offset="50%" stopColor="#253545" />
      <stop offset="100%" stopColor="#141c24" />
    </linearGradient>

    <linearGradient id="amber-clip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#d6a84f" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#b88628" stopOpacity="0.8" />
    </linearGradient>

    <linearGradient id="teal-clip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#2563eb" stopOpacity="0.75" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0.75" />
    </linearGradient>

    <linearGradient id="lavender-clip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8b5cf6" stopOpacity="0.65" />
      <stop offset="100%" stopColor="#6366f1" stopOpacity="0.65" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />

  <!-- Studio Ambient Lighting behind Dual Monitor Setup -->
  <ellipse cx="640" cy="300" rx="460" ry="240" fill="url(#screen-glow)" />

  <!-- Grid Studio Floor Guidelines -->
  <g stroke="#F3EEE5" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="580" x2="1280" y2="580" />
    <line x1="0" y1="620" x2="1280" y2="620" />
    <line x1="0" y1="670" x2="1280" y2="670" />
    <line x1="200" y1="580" x2="100" y2="720" />
    <line x1="450" y1="580" x2="400" y2="720" />
    <line x1="830" y1="580" x2="880" y2="720" />
    <line x1="1080" y1="580" x2="1180" y2="720" />
  </g>

  <!-- Ultrawide Editing Monitor Frame -->
  <g id="monitor-frame">
    <!-- Monitor Bezel -->
    <rect x="180" y="90" width="920" height="460" rx="6" fill="#0d1117" stroke="#F3EEE5" stroke-opacity="0.16" stroke-width="1.5" />
    
    <!-- Inner Screen Display Area -->
    <rect x="188" y="98" width="904" height="444" fill="#080c10" />

    <!-- NLE Header Bar -->
    <rect x="188" y="98" width="904" height="26" fill="#121820" />
    <circle cx="204" cy="111" r="3.5" fill="#d6a84f" fill-opacity="0.8" />
    <circle cx="216" cy="111" r="3.5" fill="#9D9991" fill-opacity="0.4" />
    <circle cx="228" cy="111" r="3.5" fill="#9D9991" fill-opacity="0.4" />
    <text x="246" y="115" fill="#9D9991" font-family="monospace" font-size="10" letter-spacing="1.5">TIMELINE: ASHWIN_REEL_2026_V08.prproj — 24.00 fps</text>
    <text x="1000" y="115" fill="#d6a84f" font-family="monospace" font-size="10" letter-spacing="1">00:00:08:00</text>

    <!-- Program Preview Window (Left) -->
    <rect x="204" y="136" width="460" height="230" fill="#040608" stroke="#F3EEE5" stroke-opacity="0.08" stroke-width="1" />
    <!-- Preview Frame Cut (High-energy composition) -->
    <g transform="translate(204, 136)">
      <!-- Cinematic lighting inside preview -->
      <circle cx="230" cy="115" r="90" fill="#d6a84f" fill-opacity="0.25" />
      <line x1="0" y1="115" x2="460" y2="115" stroke="#d6a84f" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4" />
      <text x="30" y="125" fill="#F3EEE5" font-family="sans-serif" font-weight="900" font-size="32" letter-spacing="2">CUT 04 / RHYTHM</text>
      <!-- Safe Area Frame -->
      <rect x="20" y="15" width="420" height="200" fill="none" stroke="#F3EEE5" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 4" />
      <text x="370" y="215" fill="#d6a84f" font-family="monospace" font-size="9">REC ● 4K</text>
    </g>

    <!-- Scopes / Color Curve Panel (Right) -->
    <rect x="680" y="136" width="396" height="230" fill="#070a0e" stroke="#F3EEE5" stroke-opacity="0.08" stroke-width="1" />
    <g transform="translate(680, 136)">
      <text x="16" y="22" fill="#9D9991" font-family="monospace" font-size="9" letter-spacing="1">COLOR SCOPES // RGB PARADE</text>
      <!-- Waveform curves -->
      <path d="M 20 180 Q 60 80, 100 130 T 180 90 T 260 140 T 360 80" fill="none" stroke="#d6a84f" stroke-width="1.8" stroke-opacity="0.8" />
      <path d="M 20 190 Q 70 120, 120 150 T 200 110 T 280 160 T 360 100" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.6" />
      <path d="M 20 170 Q 50 140, 110 110 T 190 130 T 270 90 T 360 120" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.5" />
    </g>

    <!-- Multi-Track NLE Timeline (Bottom Half of Monitor) -->
    <rect x="204" y="380" width="872" height="148" fill="#06090c" stroke="#F3EEE5" stroke-opacity="0.08" stroke-width="1" />
    
    <!-- Time Ruler -->
    <rect x="204" y="380" width="872" height="18" fill="#0f141b" />
    <g stroke="#9D9991" stroke-opacity="0.3" stroke-width="1">
      <line x1="260" y1="388" x2="260" y2="398" />
      <line x1="360" y1="388" x2="360" y2="398" />
      <line x1="460" y1="388" x2="460" y2="398" />
      <line x1="560" y1="388" x2="560" y2="398" />
      <line x1="660" y1="388" x2="660" y2="398" />
      <line x1="760" y1="388" x2="760" y2="398" />
      <line x1="860" y1="388" x2="860" y2="398" />
      <line x1="960" y1="388" x2="960" y2="398" />
      <line x1="1060" y1="388" x2="1060" y2="398" />
    </g>

    <!-- Video Track 3 (Text & Title Motion) -->
    <rect x="208" y="404" width="864" height="24" fill="#090d12" />
    <rect x="280" y="406" width="140" height="20" rx="2" fill="url(#lavender-clip)" />
    <rect x="490" y="406" width="180" height="20" rx="2" fill="url(#lavender-clip)" />
    <rect x="740" y="406" width="110" height="20" rx="2" fill="url(#lavender-clip)" />

    <!-- Video Track 2 (B-Roll & Graphic Assets) -->
    <rect x="208" y="432" width="864" height="24" fill="#0b0f15" />
    <rect x="220" y="434" width="110" height="20" rx="2" fill="url(#teal-clip)" />
    <rect x="350" y="434" width="220" height="20" rx="2" fill="url(#teal-clip)" />
    <rect x="590" y="434" width="160" height="20" rx="2" fill="url(#teal-clip)" />
    <rect x="770" y="434" width="260" height="20" rx="2" fill="url(#teal-clip)" />

    <!-- Video Track 1 (Primary Narrative Cut) -->
    <rect x="208" y="460" width="864" height="26" fill="#0d1219" />
    <rect x="208" y="462" width="160" height="22" rx="2" fill="url(#amber-clip)" />
    <rect x="372" y="462" width="190" height="22" rx="2" fill="url(#amber-clip)" />
    <rect x="566" y="462" width="120" height="22" rx="2" fill="url(#amber-clip)" />
    <rect x="690" y="462" width="210" height="22" rx="2" fill="url(#amber-clip)" />
    <rect x="904" y="462" width="168" height="22" rx="2" fill="url(#amber-clip)" />

    <!-- Audio Track A1 with Waveforms -->
    <rect x="208" y="492" width="864" height="28" fill="#080c10" />
    <path d="M 210 506 Q 230 496, 250 506 T 290 506 T 330 498 T 370 506 T 410 494 T 450 506 T 500 500 T 550 506 T 600 494 T 650 506 T 700 498 T 750 506 T 800 494 T 850 506 T 900 498 T 950 506 T 1000 496 T 1060 506" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-opacity="0.7" />

    <!-- Red/Amber Playhead Scrub Line -->
    <line x1="566" y1="380" x2="566" y2="528" stroke="#d6a84f" stroke-width="2" />
    <polygon points="560,380 572,380 566,390" fill="#d6a84f" />
  </g>

  <!-- Monitor Stand Base -->
  <path d="M 590 550 L 690 550 L 710 610 L 570 610 Z" fill="#141920" stroke="#F3EEE5" stroke-opacity="0.08" stroke-width="1" />
  <rect x="520" y="608" width="240" height="10" rx="3" fill="#0f1318" stroke="#F3EEE5" stroke-opacity="0.12" stroke-width="1" />

  <!-- Studio Desk Surface & Editing Keyboard / Deck Silhouette (Faceless Editor Presence) -->
  <rect x="0" y="618" width="1280" height="102" fill="#070a0d" />
  <line x1="0" y1="618" x2="1280" y2="618" stroke="#F3EEE5" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Editing Controller / Loupedeck Silhouette -->
  <rect x="360" y="632" width="220" height="74" rx="4" fill="#11161d" stroke="#F3EEE5" stroke-opacity="0.14" stroke-width="1" />
  <!-- Jog wheel -->
  <circle cx="530" cy="669" r="26" fill="#1b222c" stroke="#d6a84f" stroke-opacity="0.5" stroke-width="1" />
  <circle cx="530" cy="669" r="8" fill="#d6a84f" fill-opacity="0.4" />
  <!-- Dials -->
  <circle cx="390" cy="650" r="10" fill="#161c24" stroke="#9D9991" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="430" cy="650" r="10" fill="#161c24" stroke="#9D9991" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="470" cy="650" r="10" fill="#161c24" stroke="#9D9991" stroke-opacity="0.4" stroke-width="1" />

  <!-- Mechanical Keyboard Profile -->
  <rect x="620" y="638" width="280" height="66" rx="4" fill="#0e1319" stroke="#F3EEE5" stroke-opacity="0.1" stroke-width="1" />

  <!-- Foreground Atmospheric Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
    <stop offset="60%" stopColor="#000" stopOpacity="0" />
    <stop offset="100%" stopColor="#000" stopOpacity="0.65" />
  </radialGradient>
  <rect width="1280" height="720" fill="url(#vignette)" pointer-events="none" />

  <!-- Scope Framing Hairlines -->
  <path d="M 30 30 L 30 65 M 30 30 L 65 30" stroke="#F3EEE5" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 1250 30 L 1250 65 M 1250 30 L 1215 30" stroke="#F3EEE5" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 30 690 L 30 655 M 30 690 L 65 690" stroke="#F3EEE5" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 1250 690 L 1250 655 M 1250 690 L 1215 690" stroke="#F3EEE5" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top-left Editorial Badge -->
  <text x="35" y="24" fill="#d6a84f" font-family="monospace" font-size="11" letter-spacing="2">00:08 // FACELESS WORKFLOW REEL</text>
</svg>
